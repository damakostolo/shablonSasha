<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Керування подіями</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<div th:replace="~{navbar :: navbar}"></div>

<main class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="mb-1">Події</h1>
            <p class="text-muted mb-0">Керуйте подіями, локаціями та учасниками в одному місці.</p>
        </div>
        <a class="btn btn-primary" th:href="@{/events/new}">Нова подія</a>
    </div>

    <div th:if="${events.isEmpty()}" class="alert alert-info">
        Події ще не створені. Додайте першу подію, щоб розпочати планування.
    </div>

    <div class="row g-4" th:if="${!events.isEmpty()}">
        <div class="col-12 col-lg-6" th:each="event : ${events}">
            <div class="card h-100 shadow-sm">
                <div class="card-body d-flex flex-column">
                    <div class="d-flex justify-content-between align-items-start mb-3">
                        <div>
                            <h5 class="card-title mb-1" th:text="${event.title}">Назва події</h5>
                            <div class="text-muted small" th:text="${#temporals.format(event.startDateTime, 'dd.MM.yyyy HH:mm')}">Дата</div>
                        </div>
                        <span class="badge text-bg-secondary" th:text="${event.location.name}">Локація</span>
                    </div>
                    <p class="card-text text-muted" th:text="${#strings.abbreviate(event.description, 180)}">Опис події</p>
                    <ul class="list-unstyled small text-muted mb-4">
                        <li>
                            <strong>Адреса:</strong>
                            <span th:text="${event.location.address}">Адреса</span>
                        </li>
                        <li>
                            <strong>Вартість квитка:</strong>
                            <span th:text="${#numbers.formatDecimal(event.ticketPrice, 1, 'COMMA', 2, 'POINT')}">0,00</span> грн
                        </li>
                        <li>
                            <strong>Зареєстровано:</strong>
                            <span th:text="${event.registeredParticipantsCount}">0</span>
                            з <span th:text="${event.capacity}">0</span>
                        </li>
                    </ul>
                    <div class="mt-auto d-flex justify-content-between align-items-center">
                        <a class="btn btn-outline-primary" th:href="@{'/events/' + ${event.id}}">Деталі</a>
                        <span class="text-muted small" th:text="${'Вільних місць: ' + (event.capacity - event.registeredParticipantsCount)}">0</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
