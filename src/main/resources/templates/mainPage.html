<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ua">

<head>
    <meta charset="UTF-8">
    <title>Бібліотека</title>
    <link href="/css/main.css" rel="stylesheet">

</head>

<body>
<!-- Навигационная панель -->
<nav class="navbar">
    <div class="navbar-left">
        <a href="/main" class="nav-link">Каталог</a>
    </div>
    <div class="navbar-right">
        <a href="/addBook" class="nav-link">Додати книгу</a>
    </div>
</nav>

<h1>Бібліотека</h1>
<p class="subtitle">Прості інструменти для зберігання та перегляду книжок</p>

<!-- Секция карточек товаров -->
<div class="items-container" th:if="${books}">
    <div class="item-card" th:each="book : ${books}" th:id="${book.id}">
        <a th:text="${book.title}" th:href="@{/books/{id}(id=${book.id})}">Назва книги</a>
        <p class="muted">Автор: <span th:text="${book.author}">Автор</span></p>
        <p class="muted">Рік видання: <span th:text="${book.publicationYear}">0000</span></p>
        <div class="genres">
            <span class="genre-label" th:each="genre : ${book.genreList}" th:text="${genre}">Жанр</span>
        </div>
        <p class="annotation" th:text="${#strings.abbreviate(book.annotation, 110)}">Коротка анотація</p>
    </div>
</div>

</body>

</html>
