<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uk">
<head>
    <meta charset="UTF-8">
    <title th:text="${event.title}">Подія</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<div th:replace="~{navbar :: navbar}"></div>

<main class="container py-5">
    <a class="btn btn-link text-decoration-none ps-0" th:href="@{/events}">&larr; До переліку подій</a>

    <div class="d-flex flex-wrap align-items-start justify-content-between mb-4">
        <div>
            <h1 class="mb-2" th:text="${event.title}">Назва події</h1>
            <div class="text-muted">
                <span class="me-3" th:text="${#temporals.format(event.startDateTime, 'dd.MM.yyyy HH:mm')}">Дата</span>
                <span class="badge text-bg-secondary" th:text="${event.location.name}">Локація</span>
            </div>
        </div>
        <div class="text-end">
            <div class="fs-4 fw-semibold" th:text="${#numbers.formatDecimal(event.ticketPrice, 1, 'COMMA', 2, 'POINT') + ' грн'}">0,00 грн</div>
            <div class="text-muted">Вартість базового квитка</div>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-lg-7">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h2 class="h5 mb-3">Опис</h2>
                    <p class="text-muted" th:text="${event.description != null ? event.description : 'Опис відсутній'}"></p>

                    <h2 class="h5 mb-3">Локація</h2>
                    <p class="mb-1"><strong>Адреса:</strong> <span th:text="${event.location.address}">Адреса</span></p>
                    <p class="mb-0"><strong>Місткість:</strong> <span th:text="${event.location.capacity}">0</span> місць</p>
                </div>
            </div>
        </div>

        <div class="col-lg-5">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="h5 mb-3">Реєстрація учасника</h2>

                    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
                    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

                    <p class="text-muted small">Вільних місць: <strong th:text="${remainingSeats}">0</strong> з
                        <span th:text="${event.capacity}">0</span></p>

                    <form th:action="@{'/events/' + ${event.id} + '/register'}" th:object="${registrationForm}" method="post">
                        <div class="mb-3">
                            <label class="form-label" for="fullName">ПІБ учасника</label>
                            <input class="form-control" id="fullName" type="text" th:field="*{fullName}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="email">Email</label>
                            <input class="form-control" id="email" type="email" th:field="*{email}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="price">Вартість квитка, грн</label>
                            <input class="form-control" id="price" type="number" step="0.01" min="0" th:field="*{price}" placeholder="За замовчуванням як у події">
                        </div>
                        <button class="btn btn-primary w-100" type="submit" th:disabled="${remainingSeats == 0}">Зареєструвати</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <section class="mt-5">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h4 mb-0">Учасники</h2>
            <span class="text-muted">Всього: <strong th:text="${tickets.size()}">0</strong></span>
        </div>

        <div th:if="${tickets.isEmpty()}" class="alert alert-light border">Наразі ще немає зареєстрованих учасників.</div>

        <div th:if="${!tickets.isEmpty()}" class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                <tr>
                    <th scope="col">Учасник</th>
                    <th scope="col">Email</th>
                    <th scope="col">Придбано</th>
                    <th scope="col">Вартість, грн</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="ticket : ${tickets}">
                    <td th:text="${ticket.participant.fullName}">Ім'я</td>
                    <td>
                        <a th:href="${'mailto:' + ticket.participant.email}" th:text="${ticket.participant.email}">email</a>
                    </td>
                    <td th:text="${#temporals.format(ticket.purchaseDateTime, 'dd.MM.yyyy HH:mm')}">Дата</td>
                    <td th:text="${#numbers.formatDecimal(ticket.price, 1, 'COMMA', 2, 'POINT')}">0,00</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
