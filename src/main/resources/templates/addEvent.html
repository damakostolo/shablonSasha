<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Нова подія</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<div th:replace="~{navbar :: navbar}"></div>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <h1 class="mb-4">Створення події</h1>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

            <form th:action="@{/events}" th:object="${eventForm}" method="post" class="needs-validation" novalidate>
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h2 class="h5 mb-3">Основна інформація</h2>
                        <div class="mb-3">
                            <label class="form-label" for="title">Назва події</label>
                            <input class="form-control" id="title" type="text" th:field="*{title}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="description">Опис</label>
                            <textarea class="form-control" id="description" rows="4" th:field="*{description}"></textarea>
                        </div>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label" for="startDateTime">Дата та час</label>
                                <input class="form-control" id="startDateTime" type="datetime-local" th:field="*{startDateTime}" required>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label" for="ticketPrice">Вартість квитка, грн</label>
                                <input class="form-control" id="ticketPrice" type="number" step="0.01" min="0" th:field="*{ticketPrice}" required>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label" for="capacity">Кількість місць</label>
                                <input class="form-control" id="capacity" type="number" min="1" th:field="*{capacity}" required>
                            </div>
                        </div>
                    </div>

                    <div class="card-body border-top">
                        <h2 class="h5 mb-3">Локація</h2>
                        <div class="mb-3">
                            <label class="form-label" for="locationId">Оберіть наявну локацію</label>
                            <select class="form-select" id="locationId" th:field="*{locationId}">
                                <option th:value="">Створити нову локацію</option>
                                <option th:each="location : ${locations}" th:value="${location.id}"
                                        th:text="${location.name + ' — ' + location.address}"></option>
                            </select>
                            <div class="form-text">Залиште вибір пустим, щоб додати нову локацію.</div>
                        </div>

                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label" for="locationName">Назва локації</label>
                                <input class="form-control" id="locationName" type="text" th:field="*{locationName}">
                            </div>
                            <div class="col-md-5">
                                <label class="form-label" for="locationAddress">Адреса</label>
                                <input class="form-control" id="locationAddress" type="text" th:field="*{locationAddress}">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label" for="locationCapacity">Місткість</label>
                                <input class="form-control" id="locationCapacity" type="number" min="1" th:field="*{locationCapacity}">
                            </div>
                        </div>
                        <div class="form-text">Поля для нової локації необов'язкові, якщо обрано існуючу.</div>
                    </div>

                    <div class="card-footer bg-white text-end">
                        <a class="btn btn-outline-secondary" th:href="@{/events}">Скасувати</a>
                        <button class="btn btn-primary ms-2" type="submit">Створити подію</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
